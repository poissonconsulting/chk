name: canary
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  R-CMD-check:
    uses: poissonconsulting/.github/.github/workflows/R-CMD-check.yaml@main
    with:
      tier: cran
      jags: false
      cmdstan: false
      tex: false
      private: false
    secrets: inherit
  test-coverage:
    uses: poissonconsulting/.github/.github/workflows/test-coverage.yaml@main
    with:
      cmdstan: false
      tex: false
      private: false
    secrets: inherit
  pkgdown:
    permissions:
      contents: write
    uses: poissonconsulting/.github/.github/workflows/pkgdown.yaml@main
    with:
      cmdstan: false
      private: false
      deploy: false
    secrets: inherit
  check-no-suggests:
    uses: poissonconsulting/.github/.github/workflows/check-no-suggests.yaml@main
    with:
      private: false
    secrets: inherit
